<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration submitted</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:system-ui;color:#172033;padding:20px}main{max-width:520px;background:white;border:1px solid #e2e8f0;border-radius:20px;padding:36px;text-align:center}.check{font-size:30px;background:#dcfce7;color:#166534;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:auto}p{color:#64748b;line-height:1.6}.id{display:inline-block;background:#f1f5f9;border-radius:9px;padding:10px 14px;font-weight:750}a{display:inline-block;background:#315efb;color:white;text-decoration:none;padding:12px 18px;border-radius:10px}</style></head>
<body><main><div class="check">✓</div><h1>Registration submitted!</h1><p>Thank you, {{student.name}}. Your registration request has been accepted for processing.</p><div class="id">Reference: {{student.student_id}}</div><p>Course: <strong>{{student.course}}</strong></p><p>This confirms the message was accepted by SQS, not that admission is approved.</p><a href="/">Back to home</a></main></body></html>
